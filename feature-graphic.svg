<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4B44CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)" />

  <!-- Subtle decorative circles -->
  <circle cx="900" cy="80" r="160" fill="rgba(255,255,255,0.05)" />
  <circle cx="950" cy="420" r="120" fill="rgba(255,255,255,0.04)" />
  <circle cx="80" cy="430" r="100" fill="rgba(255,255,255,0.04)" />

  <!-- Logo pins (scaled down, left side) -->
  <g transform="translate(80, 140) scale(0.42)">
    <!-- Pin 1 (lighter purple) -->
    <g transform="translate(0, 0)">
      <path d="M156 20 C88 20 30 78 30 146 C30 246 156 420 156 420 C156 420 282 246 282 146 C282 78 224 20 156 20Z" fill="rgba(255,255,255,0.4)"/>
      <circle cx="156" cy="146" r="56" fill="rgba(255,255,255,0.9)"/>
    </g>
    <!-- Pin 2 (white) -->
    <g transform="translate(130, 0)">
      <path d="M156 20 C88 20 30 78 30 146 C30 246 156 420 156 420 C156 420 282 246 282 146 C282 78 224 20 156 20Z" fill="rgba(255,255,255,0.75)"/>
      <circle cx="156" cy="146" r="56" fill="rgba(255,255,255,0.95)"/>
    </g>
  </g>

  <!-- App name -->
  <text x="340" y="230" font-family="Arial" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">meopel</text>

  <!-- Tagline -->
  <text x="342" y="300" font-family="Arial" font-size="32" font-weight="400" fill="rgba(255,255,255,0.82)" letter-spacing="0.5">Meet people. No swiping. Just plans.</text>
</svg>
